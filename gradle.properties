# Project-wide Gradle settings

# JVM arguments untuk Gradle daemon (tuning memory & encoding)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable AndroidX support
android.useAndroidX=true

# Non-transitive R class (mengurangi ukuran final R class)
android.nonTransitiveRClass=true

# Kotlin code style (official untuk code formatting)
kotlin.code.style=official

# Enable Jetifier jika masih pakai library lama yang support.* (opsional)
android.enableJetifier=true

# Gunakan cache yang lebih efisien (opsional, tergantung build system)
org.gradle.caching=true

# Percepat sync dan build (eksperimen, opsional)
org.gradle.parallel=true
org.gradle.configureondemand=true
